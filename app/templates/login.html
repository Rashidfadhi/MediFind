<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MediFind | Login</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><nav class="navbar"><a href="/" class="logo">MediFind.</a><div class="nav-links"><a href="/">Home</a><a href="/registration">Register</a></div></nav>
<main class="auth-container"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to MediFind</h1><p>Use your registered account to continue.</p>
{% if request.query_params.get("registered") %}<p class="success-message">Account created. You can now sign in.</p>{% endif %}{% if error %}<p class="error-message">{{ error }}</p>{% endif %}
<form action="/web/login" method="post" class="auth-form"><div class="form-group"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button type="submit">Sign in</button></form><p class="auth-footnote">New to MediFind? <a href="/registration">Create an account</a></p></main></body></html>
